<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz Game</title>
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:#000;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:24px 20px 40px}
.top{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;color:#555}
.num{color:#000;font-weight:800;font-variant-numeric:tabular-nums}
.bar{height:6px;background:#eee;border-radius:3px;margin:12px 0 28px;overflow:hidden}
.bar i{display:block;height:100%;background:#000;width:0;transition:width .3s}
h1{font-size:22px;line-height:1.35;margin:0 0 20px}
h2{font-size:15px;margin:22px 0 10px;color:#555;font-weight:600}
.title{font-size:30px;font-weight:800;margin:6px 0 0}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:14px 16px;margin:0 0 10px;background:#fff;border:2px solid #ddd;border-radius:12px;font-size:16px;color:#000;cursor:pointer}
.opt:hover:not(:disabled){border-color:#000}
.opt b{font-size:16px;min-width:20px}
.opt.right{border-color:#1a8a3a;background:#effaf2}
.opt.wrong{border-color:#c62828;background:#fdf0f0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .opt{margin:0;justify-content:center;text-align:center}
.sel{background:#000;color:#fff;border-color:#000}
.next{margin-top:10px;padding:14px 22px;border:0;border-radius:12px;background:#000;color:#fff;font-size:16px;font-weight:600;cursor:pointer}
.next.full{width:100%;margin-top:26px}
.next.alt{background:#fff;color:#000;border:2px solid #000}
.next[hidden]{display:none}
.final{text-align:center;padding-top:30px}
.big{font-size:80px;font-weight:800;color:#000;font-variant-numeric:tabular-nums;margin:10px 0}
</style>

<body>
<div class="wrap" id="app"></div>
<script>
const CATS={
"General":[
["How many continents are there?",["5","6","7","8"],2],
["What is the capital of Japan?",["Kyoto","Osaka","Tokyo","Seoul"],2],
["What is the largest ocean on Earth?",["Atlantic","Indian","Arctic","Pacific"],3],
["How many days are in a leap year?",["365","366","364","367"],1],
["Which animal is the tallest?",["Giraffe","Elephant","Horse","Camel"],0],
["How many colors are in a rainbow?",["5","6","7","8"],2]],
"Math":[
["What is 7 × 8?",["54","56","64","58"],1],
["What is 100 ÷ 4?",["20","25","40","50"],1],
["What is 15 + 27?",["42","41","43","52"],0],
["What is 9 × 9?",["72","81","91","79"],1],
["What is 144 ÷ 12?",["10","11","12","14"],2],
["What is 50 − 18?",["38","32","28","42"],1]],
"Science":[
["Which planet is known as the Red Planet?",["Venus","Mars","Jupiter","Mercury"],1],
["What is H2O more commonly known as?",["Salt","Water","Air","Acid"],1],
["How many planets are in our solar system?",["7","8","9","10"],1],
["Which gas do plants take in?",["Oxygen","Helium","Carbon dioxide","Nitrogen"],2],
["Which organ pumps blood?",["Lungs","Liver","Brain","Heart"],3],
["What is the hardest natural substance?",["Gold","Iron","Diamond","Quartz"],2]],
"Geography":[
["What is the capital of France?",["Rome","Paris","Madrid","Berlin"],1],
["On which continent is Mount Everest?",["Africa","Europe","Asia","America"],2],
["What is the capital of Australia?",["Sydney","Melbourne","Canberra","Perth"],2],
["Which is the largest hot desert?",["Gobi","Sahara","Kalahari","Arabian"],1],
["Which country has the Great Wall?",["Japan","India","China","Peru"],2],
["Which is the smallest continent?",["Europe","Australia","Antarctica","Africa"],1]]
};
const TIMES=[0,10,20,30];
let cat="General",limit=0,list=[],i=0,score=0,locked=false,left=0,tm=null;
const app=document.getElementById("app");

function menu(){
  clearInterval(tm);
  app.innerHTML=`<div class="title">Quiz Game</div>
  <h2>1. Choose a category</h2>
  <div class="grid">${Object.keys(CATS).map(c=>`<button class="opt cat ${c===cat?"sel":""}" data-c="${c}">${c}</button>`).join("")}</div>
  <h2>2. Time per question</h2>
  <div class="grid">${TIMES.map(t=>`<button class="opt tim ${t===limit?"sel":""}" data-t="${t}">${t?`<span class="num" style="color:inherit">${t}</span>&nbsp;seconds`:"No timer"}</button>`).join("")}</div>
  <button class="next full" id="go">Start quiz</button>`;
  app.querySelectorAll(".cat").forEach(b=>b.onclick=()=>{cat=b.dataset.c;menu()});
  app.querySelectorAll(".tim").forEach(b=>b.onclick=()=>{limit=+b.dataset.t;menu()});
  document.getElementById("go").onclick=start;
}
function start(){
  list=CATS[cat].map(q=>q).sort(()=>Math.random()-.5);
  i=0;score=0;show();
}
function show(){
  locked=false;clearInterval(tm);
  const [q,o]=list[i];
  app.innerHTML=`<div class="top"><span>Question <span class="num">${i+1}</span> / <span class="num">${list.length}</span></span>
  ${limit?`<span>Time <span class="num" id="t">${limit}</span></span>`:""}<span>Score <span class="num" id="sc">${score}</span></span></div>
  <div class="bar"><i style="width:${i/list.length*100}%"></i></div>
  <h1>${q}</h1>
  ${o.map((t,k)=>`<button class="opt" data-k="${k}"><b class="num">${k+1}</b><span>${t}</span></button>`).join("")}
  <button class="next" id="nx" hidden>${i===list.length-1?"See result":"Next"}</button>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.k));
  document.getElementById("nx").onclick=()=>{i++;i<list.length?show():end()};
  if(limit){
    left=limit;
    tm=setInterval(()=>{left--;document.getElementById("t").textContent=left;if(left<=0)pick(-1)},1000);
  }
}
function pick(k){
  if(locked)return;locked=true;clearInterval(tm);
  const a=list[i][2];
  if(k===a)score++;
  app.querySelectorAll(".opt").forEach((b,n)=>{b.disabled=true;if(n===a)b.classList.add("right");else if(n===k)b.classList.add("wrong")});
  document.getElementById("sc").textContent=score;
  document.getElementById("nx").hidden=false;
}
function end(){
  const msg=score===list.length?"Perfect score!":score>=list.length*0.6?"Nice work!":"Good try, play again!";
  app.innerHTML=`<div class="final"><div>${cat}</div><div class="big">${score} / ${list.length}</div><p>${msg}</p>
  <button class="next" id="again">Play again</button> <button class="next alt" id="men">Change settings</button></div>`;
  document.getElementById("again").onclick=start;
  document.getElementById("men").onclick=menu;
}
menu();
